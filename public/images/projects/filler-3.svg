<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Placeholder: eco lodges in wooded hills">
	<defs>
		<linearGradient id="f3sky" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#faf9f6" />
			<stop offset="55%" stop-color="#efe3ce" />
			<stop offset="100%" stop-color="#cbb489" />
		</linearGradient>
		<linearGradient id="f3hill" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#9c6f1b" />
			<stop offset="100%" stop-color="#6e6e6e" />
		</linearGradient>
	</defs>

	<rect width="1200" height="900" fill="url(#f3sky)" />
	<circle cx="270" cy="210" r="86" fill="#e8b84b" opacity="0.55" />

