<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Abstract coastal skyline in warm gold and charcoal tones">
	<defs>
		<linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
			<stop offset="0%" stop-color="#1a1a1a" />
			<stop offset="45%" stop-color="#4a3a20" />
			<stop offset="78%" stop-color="#9c6f1b" />
			<stop offset="100%" stop-color="#c9971c" />
		</linearGradient>
		<radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
			<stop offset="0%" stop-color="#e8b84b" stop-opacity="0.95" />
			<stop offset="60%" stop-color="#e8b84b" stop-opacity="0.28" />
			<stop offset="100%" stop-color="#e8b84b" stop-opacity="0" />
		</radialGradient>
		<linearGradient id="ridgeFar" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#2b2b2b" stop-opacity="0.55" />
			<stop offset="100%" stop-color="#1a1a1a" stop-opacity="0.75" />
		</linearGradient>
		<linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#9c6f1b" stop-opacity="0.85" />
			<stop offset="100%" stop-color="#1a1a1a" stop-opacity="0.95" />
		</linearGradient>
	</defs>

	<rect width="1600" height="900" fill="url(#sky)" />
	<circle cx="1180" cy="560" r="360" fill="url(#sun)" />

	<!-- far ridge -->
	<path d="M0 560 L180 486 L340 534 L520 452 L700 520 L880 462 L1080 528 L1290 470 L1450 522 L1600 480 L1600 900 L0 900 Z" fill="url(#ridgeFar)" />

	<!-- near headland -->
	<path d="M0 648 L150 612 L300 656 L470 600 L640 652 L820 614 L1010 664 L1220 620 L1420 662 L1600 626 L1600 900 L0 900 Z" fill="#1a1a1a" opacity="0.82" />

	<!-- terraced buildings on the headland -->
	<g fill="#2b2b2b" opacity="0.92">
		<rect x="196" y="556" width="58" height="96" rx="6" />
		<rect x="262" y="586" width="42" height="66" rx="6" />
		<rect x="556" y="530" width="70" height="122" rx="8" />
		<rect x="634" y="572" width="46" height="80" rx="6" />
		<rect x="906" y="546" width="62" height="110" rx="7" />
		<rect x="976" y="590" width="40" height="66" rx="6" />
		<rect x="1288" y="558" width="66" height="100" rx="7" />
	</g>
	<g fill="#e8b84b" opacity="0.5">
		<rect x="210" y="574" width="9" height="13" rx="2" />
		<rect x="230" y="574" width="9" height="13" rx="2" />
		<rect x="210" y="602" width="9" height="13" rx="2" />
		<rect x="572" y="552" width="10" height="15" rx="2" />
		<rect x="596" y="552" width="10" height="15" rx="2" />
		<rect x="572" y="586" width="10" height="15" rx="2" />
		<rect x="922" y="568" width="10" height="14" rx="2" />
		<rect x="944" y="568" width="10" height="14" rx="2" />
		<rect x="1304" y="580" width="10" height="14" rx="2" />
		<rect x="1326" y="580" width="10" height="14" rx="2" />
	</g>

	<!-- water -->
	<rect y="700" width="1600" height="200" fill="url(#water)" />
	<g stroke="#e8b84b" stroke-opacity="0.22" stroke-width="3" stroke-linecap="round">
		<path d="M1090 736 h180" />
		<path d="M1140 768 h120" />
		<path d="M1060 800 h220" />
		<path d="M1130 832 h130" />
		<path d="M1080 864 h190" />
	</g>

	<!-- warm vignette so overlaid text stays legible -->
	<rect width="1600" height="900" fill="#1a1a1a" opacity="0.18" />
</svg>
